# D&D 5ª edição — apenas conteúdo do SRD 5.1 (CC-BY-4.0).
id: dnd5e
nome: "Dungeons & Dragons 5ª edição (SRD)"
versao: "5.1"
fonte: "System Reference Document 5.1 — Wizards of the Coast LLC"
licenca: "CC-BY-4.0"
conteudo_publico: true
nivel_maximo: 20

atributos:
  - { id: for, nome: Força, abrev: FOR, minimo: 1, maximo: 30 }
  - { id: des, nome: Destreza, abrev: DES, minimo: 1, maximo: 30 }
  - { id: con, nome: Constituição, abrev: CON, minimo: 1, maximo: 30 }
  - { id: int, nome: Inteligência, abrev: INT, minimo: 1, maximo: 30 }
  - { id: sab, nome: Sabedoria, abrev: SAB, minimo: 1, maximo: 30 }
  - { id: car, nome: Carisma, abrev: CAR, minimo: 1, maximo: 30 }

# srd: id da classe no SRD | papel: função típica no grupo
# prioridade: ordem em que o gerador distribui os atributos (do mais ao menos importante)
classes:
  - { id: barbaro, nome: Bárbaro, srd: barbarian, papel: defensor, dado_vida: 12, atributos_principais: [for], resistencias: [for, con], prioridade: [for, con, des, sab, car, int] }
  - { id: bardo, nome: Bardo, srd: bard, papel: suporte, dado_vida: 8, atributos_principais: [car], resistencias: [des, car], conjuracao: car, prioridade: [car, des, con, sab, int, for] }
  - { id: bruxo, nome: Bruxo, srd: warlock, papel: conjurador, dado_vida: 8, atributos_principais: [car], resistencias: [sab, car], conjuracao: car, prioridade: [car, con, des, sab, int, for] }
  - { id: clerigo, nome: Clérigo, srd: cleric, papel: suporte, dado_vida: 8, atributos_principais: [sab], resistencias: [sab, car], conjuracao: sab, prioridade: [sab, con, for, des, car, int] }
  - { id: druida, nome: Druida, srd: druid, papel: suporte, dado_vida: 8, atributos_principais: [sab], resistencias: [int, sab], conjuracao: sab, prioridade: [sab, con, des, int, car, for] }
  - { id: feiticeiro, nome: Feiticeiro, srd: sorcerer, papel: conjurador, dado_vida: 6, atributos_principais: [car], resistencias: [con, car], conjuracao: car, prioridade: [car, con, des, sab, int, for] }
  - { id: guerreiro, nome: Guerreiro, srd: fighter, papel: defensor, dado_vida: 10, atributos_principais: [for, des], resistencias: [for, con], prioridade: [for, con, des, sab, car, int] }
  - { id: ladino, nome: Ladino, srd: rogue, papel: atacante, dado_vida: 8, atributos_principais: [des], resistencias: [des, int], prioridade: [des, con, sab, int, car, for] }
  - { id: mago, nome: Mago, srd: wizard, papel: conjurador, dado_vida: 6, atributos_principais: [int], resistencias: [int, sab], conjuracao: int, prioridade: [int, con, des, sab, car, for] }
  - { id: monge, nome: Monge, srd: monk, papel: atacante, dado_vida: 8, atributos_principais: [des, sab], resistencias: [for, des], prioridade: [des, sab, con, for, int, car] }
  - { id: paladino, nome: Paladino, srd: paladin, papel: defensor, dado_vida: 10, atributos_principais: [for, car], resistencias: [sab, car], conjuracao: car, prioridade: [for, car, con, sab, des, int] }
  - { id: patrulheiro, nome: Patrulheiro, srd: ranger, papel: atacante, dado_vida: 10, atributos_principais: [des, sab], resistencias: [for, des], conjuracao: sab, prioridade: [des, sab, con, for, int, car] }

extras:
  compra_pontos:
    orcamento: 27
    custo: { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 }
  conjunto_padrao: [15, 14, 13, 12, 10, 8]
  papeis:
    defensor: "Aguenta dano e protege o grupo"
    atacante: "Causa muito dano em um alvo"
    conjurador: "Dano em área e controle com magias"
    suporte: "Cura, fortalece aliados e atrapalha inimigos"
  racas:
    dragonborn: Draconato
    dwarf: Anão
    elf: Elfo
    gnome: Gnomo
    half-elf: Meio-elfo
    half-orc: Meio-orc
    halfling: Halfling
    human: Humano
    tiefling: Tiferino
