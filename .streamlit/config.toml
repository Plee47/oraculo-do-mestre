# Identidade visual do site: "grimório".
# Verde quase preto, pergaminho claro e um único destaque dourado. Títulos em Cinzel (capitulares
# de inscrição), texto em EB Garamond (livro antigo), dados em JetBrains Mono e o nome do site em
# letra gótica. Os alertas usam tons escuros da mesma família para não destoar da página.

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#E0C07A"
backgroundColor = "#14211D"
secondaryBackgroundColor = "#1B2C27"
textColor = "#ECE3CF"
linkColor = "#E0C07A"
linkUnderline = false
borderColor = "#46503F"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.2rem"
buttonRadius = "0.2rem"
baseFontSize = 17
font = "EB Garamond:https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "Cinzel:https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap"
headingFontWeights = [500, 500, 500, 500, 500, 500]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#0D1714"
metricValueFontWeight = 500
dataframeHeaderBackgroundColor = "#1B2C27"
dataframeBorderColor = "#46503F"
chartCategoricalColors = ["#E0C07A", "#7FA8C9", "#8FB07A", "#D08A5C", "#B7A1D6", "#6FBFB4"]
chartSequentialColors = ["#3A3524", "#4F4730", "#655A3B", "#7B6E46", "#918251", "#A7965C", "#BDAA67", "#D0B671", "#E0C07A", "#F0D79B"]

greenColor = "#7FA86A"
greenTextColor = "#B9D6A6"
greenBackgroundColor = "#1F3327"
blueColor = "#7FA8C9"
blueTextColor = "#B5CFE0"
blueBackgroundColor = "#1C2F3A"
orangeColor = "#D08A5C"
orangeTextColor = "#E8C08F"
orangeBackgroundColor = "#3A2A1A"
redColor = "#C96A55"
redTextColor = "#EDA99A"
redBackgroundColor = "#3B1F1C"
yellowColor = "#C9A961"
yellowTextColor = "#E8D48F"
yellowBackgroundColor = "#33301A"
grayColor = "#8D9186"
grayTextColor = "#C9BFA8"
grayBackgroundColor = "#22302B"

[theme.sidebar]
backgroundColor = "#0D1714"
secondaryBackgroundColor = "#14211D"
borderColor = "#5C4E2C"
