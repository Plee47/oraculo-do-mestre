# Identidade visual do site: "grimório de dados".
# Papel quente, tinta escura e um único destaque cor de brasa. Títulos em Fraunces (serifa
# com personalidade, lembra livro de regras), texto em Inter e dados em JetBrains Mono.
# Os alertas usam a mesma família de tons para não destoar do papel.

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#B5452B"
backgroundColor = "#F7F2E8"
secondaryBackgroundColor = "#EFE7D8"
textColor = "#221D17"
linkColor = "#9C3A24"
linkUnderline = false
borderColor = "#DCCFB9"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
baseFontSize = 16
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#EFE7D8"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#EFE7D8"
dataframeBorderColor = "#DCCFB9"
chartCategoricalColors = ["#B5452B", "#2B4C66", "#7A8B3C", "#C08A2E", "#5E4B3C", "#3F7F7A"]
chartSequentialColors = ["#F4DCD4", "#EBC3B4", "#E0A893", "#D38C73", "#C47055", "#B5452B", "#9C3A24", "#82301E", "#682618", "#4E1C12"]

greenColor = "#4C7A4F"
greenTextColor = "#2F5D3A"
greenBackgroundColor = "#E3EBD8"
blueColor = "#3E6585"
blueTextColor = "#2B4C66"
blueBackgroundColor = "#E1E7EA"
orangeColor = "#C0742B"
orangeTextColor = "#8A4B12"
orangeBackgroundColor = "#F5E3CC"
redColor = "#B5452B"
redTextColor = "#8E2B1C"
redBackgroundColor = "#F4DCD4"
yellowColor = "#B8952B"
yellowTextColor = "#6F5A12"
yellowBackgroundColor = "#F3EACB"
grayColor = "#8A7D6B"
grayTextColor = "#6B5F50"
grayBackgroundColor = "#EAE2D3"

[theme.sidebar]
backgroundColor = "#EFE7D8"
secondaryBackgroundColor = "#E6DCCA"
borderColor = "#D3C4AA"
