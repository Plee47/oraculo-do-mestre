# Pipeline do Oráculo do Mestre: setup -> bronze -> silver -> gold/exportação.
# Sem definição de cluster: as tarefas rodam em compute serverless.
resources:
  jobs:
    oraculo_pipeline:
      name: oraculo-do-mestre
      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: schema
          default: ${var.schema}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py

        - task_key: bronze_srd
          depends_on: [{ task_key: setup }]
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/01_bronze_srd.py

        - task_key: silver_srd
          depends_on: [{ task_key: bronze_srd }]
          notebook_task:
            notebook_path: ../notebooks/02_silver_srd.py

        - task_key: gold_exportacao
          depends_on: [{ task_key: silver_srd }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_exportacao.py
