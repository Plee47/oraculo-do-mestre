# Pipeline do Oráculo do Mestre:
#   setup -> bronze -> silver -> gold/exportação (catálogo SRD)
#   setup -> corpus do detector -> treino do detector (MLflow)
# Sem definição de cluster: as tarefas rodam em compute serverless.
resources:
  jobs:
    oraculo_pipeline:
      name: oraculo-do-mestre
      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: schema
          default: ${var.schema}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py

        - task_key: bronze_srd
          depends_on: [{ task_key: setup }]
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../notebooks/01_bronze_srd.py

        - task_key: silver_srd
          depends_on: [{ task_key: bronze_srd }]
          notebook_task:
            notebook_path: ../notebooks/02_silver_srd.py

        - task_key: gold_exportacao
          depends_on: [{ task_key: silver_srd }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_exportacao.py

        - task_key: detector_corpus
          depends_on: [{ task_key: setup }]
          max_retries: 1
          notebook_task:
            notebook_path: ../notebooks/10_detector_corpus.py

        - task_key: detector_treino
          depends_on: [{ task_key: detector_corpus }]
          notebook_task:
            notebook_path: ../notebooks/11_detector_treino.py

        # Leitor de livros: porteiro -> avaliação dos LLMs (SRD) -> extração dos livros aceitos
        - task_key: leitor_porteiro
          depends_on: [{ task_key: detector_treino }]
          notebook_task:
            notebook_path: ../notebooks/20_leitor_porteiro.py

        - task_key: leitor_avaliacao
          depends_on: [{ task_key: leitor_porteiro }, { task_key: silver_srd }]
          notebook_task:
            notebook_path: ../notebooks/21_leitor_avaliacao.py

        - task_key: leitor_generico_avaliacao
          depends_on: [{ task_key: leitor_porteiro }, { task_key: silver_srd }]
          notebook_task:
            notebook_path: ../notebooks/23_leitor_generico_avaliacao.py

        - task_key: leitor_extracao
          depends_on: [{ task_key: leitor_avaliacao }]
          notebook_task:
            notebook_path: ../notebooks/22_leitor_extracao.py
