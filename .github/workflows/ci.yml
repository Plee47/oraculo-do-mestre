name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardiao:
    name: Guardião de conteúdo (sem livros protegidos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m oraculo.guardiao

  qualidade:
    name: Lint e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (inclui smoke test do site)
        run: pytest -q

  site-streamlit:
    name: Site com só o requirements.txt (como no Streamlit Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # pythonpath vazio: o site precisa achar o código sozinho, sem o pacote instalado.
      - run: pytest -q -o pythonpath= tests/test_app.py

  deploy-databricks:
    name: Deploy do bundle (prod)
    needs: [guardiao, qualidade, site-streamlit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main
      - name: Código no volume + bundle deploy (ADR 0004)
        run: python scripts/deploy.py -t prod
