repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: guardiao-conteudo
        name: Guardião de conteúdo
        entry: python scripts/guardiao.py
        language: python
        additional_dependencies: ["pydantic>=2.6", "pyyaml>=6.0"]
        pass_filenames: false
        always_run: true
