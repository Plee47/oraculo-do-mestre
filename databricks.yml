# Databricks Asset Bundle — a "fábrica" de dados do Oráculo do Mestre.
# Docs: https://docs.databricks.com/dev-tools/bundles/
bundle:
  name: oraculo-do-mestre

include:
  - pipelines/resources/*.yml

sync:
  exclude:
    - app/**
    - tests/**

variables:
  catalogo:
    description: Catálogo do Unity Catalog (no Free Edition o padrão é "workspace")
    default: workspace
  schema:
    description: Schema com volumes, tabelas e modelos do projeto
    default: oraculo_dev

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    variables:
      schema: oraculo
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
